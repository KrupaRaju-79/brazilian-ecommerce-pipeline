name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1

jobs:
  # -----------------------------------------------------------------------
  # Job 1: dbt tests (runs on every PR)
  # -----------------------------------------------------------------------
  dbt-test:
    name: dbt build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-bigquery
        run: |
          pip install dbt-bigquery==1.7.*

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Write dbt profiles
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          brazilian_ecommerce:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: service-account
                project: ${{ env.PROJECT_ID }}
                dataset: staging
                location: ${{ env.REGION }}
                threads: 4
                keyfile: /tmp/gcp-key.json
          EOF

      - name: Write GCP key
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp-key.json

      - name: dbt deps
        working-directory: dbt_project
        run: dbt deps

      - name: dbt build (compile + test)
        working-directory: dbt_project
        run: dbt build --target ci

  # -----------------------------------------------------------------------
  # Job 2: Terraform plan (runs on every PR, apply only on main)
  # -----------------------------------------------------------------------
  terraform:
    name: Terraform plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: infrastructure/terraform
        run: |
          terraform plan \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -no-color
        continue-on-error: true

      # Only apply on pushes to main (not on PRs)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: infrastructure/terraform
        run: |
          terraform apply \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -auto-approve \
            -no-color

  # -----------------------------------------------------------------------
  # Job 3: Python linting for Beam pipeline
  # -----------------------------------------------------------------------
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install flake8 black

      - name: Black format check
        run: black --check ingestion/

      - name: Flake8 lint
        run: flake8 ingestion/ --max-line-length=100
